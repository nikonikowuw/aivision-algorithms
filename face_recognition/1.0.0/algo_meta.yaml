algorithm: "face_recognition"
version: "1.0.0"
domain: "face"
result_schema: "face_identity"
capabilities:
  image: ["detect", "estimate_keypoints", "extract_embedding"]
  data: ["track", "recognize_identity"]
description: "人脸识别算法，基于InsightFace buffalo_l模型和YOLOv8-n人体检测，支持ByteTracker人体追踪"
hardware: ["rk3588", "rk3576", "x86_64"]

ai_params_schema:
  type: "object"
  properties:
    conf_thres:
      type: "number"
      title: "置信度阈值"
      description: "过滤低置信度目标的阈值"
      default: 0.5
      minimum: 0.0
      maximum: 1.0
    iou_thres:
      type: "number"
      title: "NMS IOU 阈值"
      description: "非极大值抑制重叠度阈值"
      default: 0.45
      minimum: 0.0
      maximum: 1.0
    enable_tracker:
      type: "boolean"
      title: "启用ByteTracker人体追踪"
      description: "在视频流模式下启用ByteTracker进行人体追踪"
      default: true
    face_conf_thres:
      type: "number"
      title: "人脸置信度阈值"
      description: "人脸检测置信度阈值"
      default: 0.6
      minimum: 0.0
      maximum: 1.0
    face_quality_thres:
      type: "number"
      title: "人脸质量阈值"
      description: "人脸质量评分阈值，低于此值的人脸将被过滤"
      default: 0.3
      minimum: 0.0
      maximum: 1.0
    max_faces:
      type: "integer"
      title: "最大人脸数"
      description: "单帧最大检测人脸数量"
      default: 10
      minimum: 1
      maximum: 50
    recognition_threshold:
      type: "number"
      title: "人脸识别阈值"
      description: "人脸识别相似度阈值，高于此值认为是同一人"
      default: 0.6
      minimum: 0.0
      maximum: 1.0
  required: ["conf_thres", "iou_thres", "face_conf_thres"]