algorithm: "face_recognition"
version: "1.0.0"
domain: "face"
result_schema: "face_identity_track"
capabilities:
  image:
    [
      "detect_person",
      "track_person",
      "detect_face",
      "align_face",
      "extract_embedding",
      "recognize_face",
    ]
  data: ["bytetrack", "emit_identity", "emit_track", "coreml", "ane"]
description: "人脸识别算法 (M1 Pro)，基于 SCRFD 人体检测、ByteTrack 轨迹关联、InsightFace scrfd_2.5g_bnkps 人脸检测和 AdaFace 人脸特征识别"
hardware: ["apple_m1_pro"]

ai_params_schema:
  type: "object"
  properties:
    enable_tracker:
      type: "boolean"
      title: "启用人员追踪"
      description: "开启后使用 ByteTrack 为人体和人脸结果关联稳定 track_id"
      default: true
    person_conf_thres:
      type: "number"
      title: "人体置信度阈值"
      description: "数值越高，人体检测越严格，误检更少但可能漏检"
      default: 0.45
      minimum: 0.0
      maximum: 1.0
    face_conf_thres:
      type: "number"
      title: "人脸置信度阈值"
      description: "数值越高，人脸检测越严格，误检更少但可能漏检"
      default: 0.55
      minimum: 0.0
      maximum: 1.0
    recognition_threshold:
      type: "number"
      title: "人脸识别相似度阈值"
      description: "数值越高，身份识别越严格，误认更少但可能输出未知人员"
      default: 0.45
      minimum: 0.0
      maximum: 1.0
  required:
    [
      "enable_tracker",
      "person_conf_thres",
      "face_conf_thres",
      "recognition_threshold",
    ]
